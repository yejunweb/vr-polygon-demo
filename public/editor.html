<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />
  <title>编辑 - 多边形 / 折线热点</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="editor-page">
  <header class="toolbar">
    <h1>热点编辑</h1>
    <button class="btn" id="btn-poly" type="button">多边形</button>
    <button class="btn" id="btn-line" type="button">折线</button>
    <button class="btn" id="btn-finish" type="button" disabled>完成</button>
    <button class="btn" id="btn-undo" type="button" disabled>撤销点</button>
    <button class="btn danger" id="btn-delete" type="button" disabled>删除</button>
    <span class="spacer"></span>
    <button class="btn primary" id="btn-save" type="button">保存</button>
    <a class="btn" href="/preview">预览</a>
  </header>
  <aside class="sidebar">
    <h2>多边形 / 折线</h2>
    <ul class="hotspot-list" id="hotspot-list"></ul>
  </aside>
  <div id="pano"></div>
  <div class="status" id="status">加载中…</div>
  <script src="/krpano/tour.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/hotspots.js"></script>
  <script src="/js/editor.js"></script>
  <script>
    embedpano({
      xml: "/krpano/tour.xml",
      target: "pano",
      html5: "only",
      mobilescale: 1.0,
      consolelog: false,
      passQueryParameters: true,
      onready: function (krpano) {
        window.krpano = krpano;
      }
    });
  </script>
</body>
</html>
