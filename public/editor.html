<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />
  <title>编辑 - 热点</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="editor-page">
  <header class="toolbar">
    <h1>热点编辑</h1>
    <span class="spacer"></span>
    <button class="btn primary" id="btn-save" type="button">保存</button>
    <a class="btn" href="/preview">预览</a>
  </header>
  <aside class="sidebar">
    <section class="panel" id="panel-list">
      <div class="sidebar-head">
        <h2>热点 <span id="hotspot-count">0/500</span></h2>
      </div>
      <button class="btn primary btn-block" id="btn-add" type="button">添加热点</button>
      <div class="search-row">
        <input id="hotspot-search" type="search" placeholder="搜索热点" autocomplete="off" />
      </div>
      <ul class="hotspot-list" id="hotspot-list"></ul>
    </section>

    <section class="panel" id="panel-picker" hidden>
      <div class="sidebar-head">
        <button class="icon-btn" id="btn-picker-back" type="button" title="返回">←</button>
        <h2>选择热点类型</h2>
      </div>
      <button class="type-card" id="pick-poly" type="button">
        <span class="hs-icon poly" aria-hidden="true"></span>
        <span>多边形</span>
      </button>
      <button class="type-card" id="pick-line" type="button">
        <span class="hs-icon line" aria-hidden="true"></span>
        <span>折线</span>
      </button>
    </section>

    <section class="panel" id="panel-settings" hidden>
      <div class="sidebar-head">
        <button class="icon-btn" id="btn-settings-back" type="button" title="返回">←</button>
        <h2 id="settings-title">热点设置</h2>
      </div>
      <div class="field" id="name-field">
        <label>名称</label>
        <input id="input-title" type="text" maxlength="40" />
      </div>
      <div class="draw-actions" id="draw-actions" hidden>
        <button class="btn" id="btn-finish" type="button" disabled>完成绘制</button>
        <button class="btn" id="btn-undo" type="button" disabled>撤销点</button>
      </div>
      <button class="btn danger btn-block" id="btn-delete" type="button">删除热点</button>

      <div id="poly-settings">
        <div class="tabs" id="style-tabs">
          <button class="tab active" type="button" data-state="normal">默认状态</button>
          <button class="tab" type="button" data-state="hover">移入状态</button>
        </div>
        <div class="field">
          <div class="field-head">
            <label>线条颜色</label>
            <button class="reset-btn" id="reset-border" type="button" title="重置">↻</button>
          </div>
          <div class="color-row">
            <input id="input-border-color" type="color" />
            <input id="input-border-hex" type="text" spellcheck="false" />
          </div>
        </div>
        <div class="field" id="fill-field">
          <div class="field-head">
            <label>填充颜色</label>
            <button class="reset-btn" id="reset-fill" type="button" title="重置">↻</button>
          </div>
          <div class="color-row">
            <input id="input-fill-color" type="color" />
            <input id="input-fill-hex" type="text" spellcheck="false" />
          </div>
        </div>
        <div class="field">
          <div class="field-head">
            <label>线条粗细</label>
            <span id="width-value">2px</span>
          </div>
          <input id="input-border-width" type="range" min="1" max="20" step="1" />
          <div class="range-labels"><span>1px</span><span>20px</span></div>
        </div>
        <div class="switch-row">
          <span>默认/移入状态交替变化</span>
          <label class="switch">
            <input id="input-blink" type="checkbox" />
            <span class="switch-ui"></span>
          </label>
        </div>

        <section class="accordion open" id="title-settings">
          <button class="accordion-head" id="btn-title-toggle" type="button">
            标题设置
            <span class="chevron">▾</span>
          </button>
          <div class="accordion-body">
            <div class="textarea-wrap">
              <textarea id="input-title-text" maxlength="500" rows="3"></textarea>
              <span class="char-count" id="title-count">0/500</span>
            </div>
            <div class="switch-row compact">
              <span>显示标题</span>
              <label class="switch">
                <input id="input-show-title" type="checkbox" />
                <span class="switch-ui"></span>
              </label>
            </div>
            <div class="switch-row compact">
              <span>跟随画面同步缩放</span>
              <label class="switch">
                <input id="input-title-zoom" type="checkbox" />
                <span class="switch-ui"></span>
              </label>
            </div>
            <div class="switch-row compact">
              <span>固定水平垂直显示</span>
              <label class="switch">
                <input id="input-title-fixed" type="checkbox" />
                <span class="switch-ui"></span>
              </label>
            </div>
            <div class="switch-row compact">
              <span>仅鼠标移入显示（PC端有效）</span>
              <label class="switch">
                <input id="input-title-hover" type="checkbox" />
                <span class="switch-ui"></span>
              </label>
            </div>
          </div>
        </section>
      </div>

      <div id="image-settings" hidden>
        <p class="hint">图片热点仅支持查看与删除，样式请在素材中调整。</p>
      </div>
    </section>
  </aside>
  <div id="pano"></div>
  <div class="status" id="status">加载中…</div>
  <script src="/krpano/tour.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/hotspots.js"></script>
  <script src="/js/editor.js"></script>
  <script>
    embedpano({
      xml: "/krpano/tour.xml",
      target: "pano",
      html5: "only",
      mobilescale: 1.0,
      consolelog: false,
      passQueryParameters: true,
      onready: function (krpano) {
        window.krpano = krpano;
      }
    });
  </script>
</body>
</html>
