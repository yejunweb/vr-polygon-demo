<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />
  <title>折线 / 色块 / 图片热点</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    #pano {
      width: 100%;
      height: 100%;
    }
    #tour-title {
      position: absolute;
      left: 16px;
      top: 16px;
      z-index: 20;
      color: #fff;
      font-size: 14px;
      line-height: 1.4;
      padding: 6px 12px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 4px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="pano"></div>
  <div id="tour-title"></div>
  <script src="krpano/tour.js"></script>
  <script src="js/hotspots.js"></script>
  <script>
    embedpano({
      xml: "krpano/tour.xml",
      target: "pano",
      html5: "only",
      mobilescale: 1.0,
      consolelog: false,
      passQueryParameters: true,
      onready: function (krpano) {
        window.krpano = krpano;
      }
    });
  </script>
</body>
</html>
